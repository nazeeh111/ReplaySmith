<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">ReplaySmith</title><desc id="d">Show it once. Run it reliably. Local browser workflows with inspectable recovery and verified outcomes.</desc><rect width="1200" height="300" rx="20" fill="#f6f5ef"/><g transform="translate(62 65)"><rect width="60" height="60" rx="13" fill="#e8532d"/><path d="M20 17h14a14 14 0 0 1 0 28H20m0-28 7-6m-7 6 7 6m-7 22 7-6m-7 6 7 6m2-22 8 8-8 8" stroke="#fffef8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="144" y="111" font-family="Arial,sans-serif" font-size="49" font-weight="700" letter-spacing="-2" fill="#272d24">ReplaySmith</text><text x="63" y="190" font-family="Arial,sans-serif" font-size="38" font-weight="600" letter-spacing="-1.2" fill="#272d24">Show it once. Run it reliably<tspan fill="#e8532d">.</tspan></text><text x="65" y="235" font-family="Arial,sans-serif" font-size="18" fill="#67725c">Record → Understand → Improve → Verify → Replay → Export</text><g transform="translate(907 66)"><path d="M0 26h161M0 70h161M0 114h161M0 158h161" stroke="#d7ddcd"/><g fill="#e8532d"><circle cx="21" cy="26" r="6"/><circle cx="64" cy="70" r="6"/><circle cx="107" cy="114" r="6"/><circle cx="150" cy="158" r="6"/></g><path d="M21 26v20h43v24m0 0v20h43v24m0 0v20h43v24" stroke="#a7b19a" fill="none" stroke-width="2"/></g></svg>
