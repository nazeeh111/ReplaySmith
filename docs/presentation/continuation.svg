<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">A passed receipt can still precede a withheld action</title><desc id="desc">In the changed-evidence fixture, Pause runs once and the Done receipt passes, but Next is withheld. The matched control runs both actions. These two synthetic cases do not establish target identity at dispatch.</desc><rect width="1100" height="560" fill="#f5f4ef"/><text x="34" y="32" fill="#69725e" font-family="Arial, Helvetica, sans-serif" font-size="11">REPLAYSMITH / CONTINUATION WITNESS</text><text x="34" y="84" fill="#292d27" font-family="Georgia, serif" font-size="42">A receipt passes. The next action waits.</text><text x="34" y="119" fill="#292d27" font-family="Arial, Helvetica, sans-serif" font-size="16">Two owned fixtures. Native results, not a success rate.</text><rect x="34" y="160" width="1032" height="120" rx="7" fill="#fff" stroke="#d9ddd0"/><text x="50" y="187" fill="#aa431e" font-family="Arial, Helvetica, sans-serif" font-size="11">01 / CHANGED TARGET EVIDENCE</text><text x="50" y="221" fill="#292d27" font-family="Arial, Helvetica, sans-serif" font-size="18">Pause dispatched</text><text x="50" y="246" fill="#5c6556" font-family="Courier New, Courier, monospace" font-size="14">first effect: 1</text><text x="340" y="221" fill="#292d27" font-family="Arial, Helvetica, sans-serif" font-size="18">Done receipt</text><text x="340" y="246" fill="#5c6556" font-family="Courier New, Courier, monospace" font-size="14">passed</text><text x="630" y="221" fill="#292d27" font-family="Arial, Helvetica, sans-serif" font-size="18">Next action</text><text x="630" y="246" fill="#aa431e" font-family="Courier New, Courier, monospace" font-size="14">withheld / effect: 0</text><text x="821" y="187" fill="#292d27" font-family="Arial, Helvetica, sans-serif" font-size="12">ABSTAINED / false</text><rect x="34" y="299" width="1032" height="120" rx="7" fill="#fff" stroke="#d9ddd0"/><text x="50" y="326" fill="#536347" font-family="Arial, Helvetica, sans-serif" font-size="11">02 / MATCHED CONTROL</text><text x="50" y="360" fill="#292d27" font-family="Arial, Helvetica, sans-serif" font-size="18">Pause dispatched</text><text x="50" y="385" fill="#5c6556" font-family="Courier New, Courier, monospace" font-size="14">first effect: 1</text><text x="340" y="360" fill="#292d27" font-family="Arial, Helvetica, sans-serif" font-size="18">Done receipt</text><text x="340" y="385" fill="#5c6556" font-family="Courier New, Courier, monospace" font-size="14">passed</text><text x="630" y="360" fill="#292d27" font-family="Arial, Helvetica, sans-serif" font-size="18">Next action</text><text x="630" y="385" fill="#5c6556" font-family="Courier New, Courier, monospace" font-size="14">dispatched / effect: 1</text><text x="821" y="326" fill="#292d27" font-family="Arial, Helvetica, sans-serif" font-size="12">PASSED / true</text><text x="34" y="477" fill="#292d27" font-family="Arial, Helvetica, sans-serif" font-size="16">A later action is withheld, not rolled back. The first effect already happened.</text><text x="34" y="499" fill="#292d27" font-family="Arial, Helvetica, sans-serif" font-size="16">Outcome checks do not prove which target received an action.</text></svg>